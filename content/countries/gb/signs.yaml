    image: "content/countries/gb/signs/bus_lane.svg"

  - id: GB.SIGN.CYCLE_LANE
    name: "With-flow cycle lane"
    tsrgdDiagram: "959.1"
    category: regulatory
    meaning: "Lane reserved for pedal cycles."
    relatedRules: ["GB.VRU.CYCLE_LANE_SOLID", "GB.VRU.CYCLE_LANE_BROKEN"]
