<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/>
    </marker>
    <clipPath id="clipL"><rect x="0" y="0" width="760" height="640" rx="18"/></clipPath>
    <clipPath id="clipR"><rect x="0" y="0" width="760" height="640" rx="18"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#f4f5f7"/>
  <text x="800" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2433">Same moment, two styles: approaching a roundabout</text>
  <text x="800" y="84" text-anchor="middle" font-size="18" fill="#5a6270">The player is about to enter, and a car is already coming round from the right. The game must teach "give way to the right".</text>

  <!-- ================= LEFT: 2D TOP-DOWN ================= -->
  <g transform="translate(30,110)">
    <g clip-path="url(#clipL)">
      <rect width="760" height="640" fill="#9cc77a"/>
      <!-- trees -->
      <g fill="#5f9a45">
        <circle cx="90" cy="90" r="28"/><circle cx="150" cy="60" r="20"/><circle cx="640" cy="80" r="26"/>
        <circle cx="690" cy="140" r="18"/><circle cx="110" cy="520" r="30"/><circle cx="640" cy="540" r="28"/>
        <circle cx="200" cy="600" r="18"/><circle cx="560" cy="610" r="20"/>
      </g>
      <!-- houses -->
      <g fill="#d9c6a5" stroke="#b49c74" stroke-width="2">
        <rect x="40" y="150" width="70" height="55"/><rect x="600" y="400" width="80" height="60"/><rect x="560" y="170" width="70" height="50"/>
      </g>
      <!-- arms -->
      <g fill="#6b6f76">
        <rect x="335" y="0" width="90" height="200"/>
        <rect x="335" y="400" width="90" height="240"/>
        <rect x="0" y="255" width="280" height="90"/>
        <rect x="480" y="255" width="280" height="90"/>
      </g>
      <!-- ring + island -->
      <circle cx="380" cy="300" r="135" fill="#6b6f76"/>
      <circle cx="380" cy="300" r="68" fill="#7fb35a" stroke="#ffffff" stroke-width="4"/>
      <circle cx="380" cy="300" r="20" fill="#5f9a45"/>
      <!-- centre lines on arms -->
      <g stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14">
        <line x1="380" y1="0" x2="380" y2="160"/>
        <line x1="380" y1="440" x2="380" y2="640"/>
        <line x1="0" y1="300" x2="240" y2="300"/>
        <line x1="520" y1="300" x2="760" y2="300"/>
      </g>
      <!-- give way lines (entry lanes are on the LEFT of each approach) -->
      <g stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6">
        <line x1="337" y1="433" x2="378" y2="433"/><line x1="337" y1="441" x2="378" y2="441"/>
        <line x1="382" y1="167" x2="423" y2="167"/><line x1="382" y1="159" x2="423" y2="159"/>
        <line x1="247" y1="257" x2="247" y2="298"/><line x1="239" y1="257" x2="239" y2="298"/>
        <line x1="513" y1="302" x2="513" y2="343"/><line x1="521" y1="302" x2="521" y2="343"/>
      </g>
      <!-- zebra on south arm -->
      <g fill="#ffffff">
        <rect x="337" y="515" width="9" height="30"/><rect x="354" y="515" width="9" height="30"/>
        <rect x="371" y="515" width="9" height="30"/><rect x="388" y="515" width="9" height="30"/>
        <rect x="405" y="515" width="9" height="30"/>
      </g>
      <circle cx="324" cy="530" r="7" fill="#f6b21b" stroke="#333" stroke-width="2"/>
      <circle cx="436" cy="530" r="7" fill="#f6b21b" stroke="#333" stroke-width="2"/>
      <circle cx="442" cy="560" r="8" fill="#e46b4c"/><text x="456" y="566" font-size="13" fill="#1d2433">pedestrian</text>
      <!-- clockwise flow arrow -->
      <path d="M 280 300 A 100 100 0 0 1 380 200" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
      <path d="M 480 300 A 100 100 0 0 1 380 400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
      <!-- AI car on the ring, coming from the right -->
      <g transform="translate(467,350) rotate(210)">
        <rect x="-12" y="-21" width="24" height="42" rx="5" fill="#d64545"/>
        <rect x="-9" y="-14" width="18" height="10" rx="2" fill="#2a2f3a"/>
      </g>
      <!-- player car, keeping LEFT on the south arm -->
      <g transform="translate(357,478)">
        <rect x="-12" y="-21" width="24" height="42" rx="5" fill="#2f6fde" stroke="#ffffff" stroke-width="2"/>
        <rect x="-9" y="-14" width="18" height="10" rx="2" fill="#2a2f3a"/>
        <rect x="-14" y="-18" width="5" height="5" fill="#ffb300"/>
      </g>
      <!-- callouts -->
      <line x1="340" y1="478" x2="250" y2="478" stroke="#1d2433" stroke-width="2"/>
      <text x="150" y="472" font-size="15" font-weight="700" fill="#1d2433">You</text>
      <text x="150" y="490" font-size="13" fill="#1d2433">(keep left)</text>
      <line x1="490" y1="365" x2="560" y2="380" stroke="#1d2433" stroke-width="2"/>
      <text x="565" y="378" font-size="15" font-weight="700" fill="#1d2433">Has priority</text>
      <text x="565" y="396" font-size="13" fill="#1d2433">(from your right)</text>
      <!-- toast -->
      <rect x="150" y="18" width="460" height="54" rx="12" fill="#1d2433" opacity="0.92"/>
      <circle cx="180" cy="45" r="13" fill="#f2a33a"/><text x="180" y="51" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2433">!</text>
      <text x="204" y="41" font-size="17" font-weight="700" fill="#ffffff">Give way to traffic from your right</text>
      <text x="204" y="61" font-size="13" fill="#c9d1de">Highway Code rule 185 · tap to replay</text>
      <!-- speed -->
      <rect x="18" y="580" width="110" height="42" rx="10" fill="#ffffff" opacity="0.9"/>
      <text x="73" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2433">28 mph</text>
    </g>
    <rect x="0" y="0" width="760" height="640" rx="18" fill="none" stroke="#c9ced6" stroke-width="2"/>
    <text x="0" y="680" font-size="24" font-weight="700" fill="#1d2433">2D top-down</text>
    <text x="0" y="708" font-size="16" fill="#5a6270">Like driving inside a Highway Code diagram · Flutter + Flame could build this</text>
    <g font-size="16" fill="#1d2433">
      <text x="0" y="746">✔ Very clear: you see everyone's position and priority at once</text>
      <text x="0" y="772">✔ Faster and cheaper to build; small app; great menus</text>
      <text x="0" y="798">✘ Not what real driving looks like: no mirrors, blind spots or reading signs</text>
      <text x="0" y="824">✘ Hard to judge gaps and speed the way you must on the road</text>
    </g>
  </g>

  <!-- ================= RIGHT: 3D LOW-POLY CHASE CAM ================= -->
  <g transform="translate(810,110)">
    <g clip-path="url(#clipR)">
      <rect width="760" height="260" fill="url(#sky)"/>
      <rect y="255" width="760" height="385" fill="#9cc77a"/>
      <!-- hills -->
      <polygon points="0,262 120,225 240,258 360,232 470,256 600,222 760,258 760,266 0,266" fill="#86b866"/>
      <!-- low-poly buildings: left -->
      <polygon points="20,150 150,165 150,300 20,315" fill="#d9c6a5"/>
      <polygon points="150,165 210,185 210,285 150,300" fill="#b9a27c"/>
      <polygon points="20,150 85,128 210,185 150,165" fill="#a35d4b"/>
      <g fill="#7a8aa0"><rect x="40" y="190" width="22" height="26"/><rect x="95" y="196" width="22" height="26"/><rect x="40" y="240" width="22" height="26"/><rect x="95" y="244" width="22" height="26"/></g>
      <!-- right building -->
      <polygon points="600,175 740,160 740,310 600,295" fill="#cfd6df"/>
      <polygon points="545,195 600,175 600,295 545,280" fill="#aab4c1"/>
      <g fill="#6f7f95"><rect x="620" y="200" width="22" height="24"/><rect x="680" y="196" width="22" height="24"/><rect x="620" y="245" width="22" height="24"/><rect x="680" y="242" width="22" height="24"/></g>
      <!-- low-poly trees -->
      <polygon points="250,250 265,205 280,250" fill="#5f9a45"/><rect x="262" y="250" width="6" height="12" fill="#7a5a3a"/>
      <polygon points="500,252 512,215 524,252" fill="#5f9a45"/><rect x="509" y="252" width="6" height="10" fill="#7a5a3a"/>
      <!-- roundabout ring + side arms -->
      <polygon points="0,272 170,276 170,296 0,306" fill="#6b6f76"/>
      <polygon points="590,276 760,272 760,306 590,296" fill="#6b6f76"/>
      <polygon points="368,252 392,252 400,272 360,272" fill="#6b6f76"/>
      <ellipse cx="380" cy="286" rx="235" ry="30" fill="#6b6f76"/>
      <ellipse cx="380" cy="282" rx="120" ry="13" fill="#7fb35a" stroke="#ffffff" stroke-width="2.5"/>
      <polygon points="372,282 380,262 388,282" fill="#5f9a45"/>
      <!-- approach road -->
      <polygon points="120,640 640,640 418,305 342,305" fill="#6b6f76"/>
      <!-- edge lines -->
      <line x1="150" y1="640" x2="346" y2="306" stroke="#ffffff" stroke-width="3"/>
      <line x1="610" y1="640" x2="414" y2="306" stroke="#ffffff" stroke-width="3"/>
      <!-- centre dashes in perspective -->
      <g fill="#ffffff">
        <polygon points="377,640 383,640 382.5,600 377.5,600"/>
        <polygon points="377.8,560 382.2,560 381.9,530 378.1,530"/>
        <polygon points="378.4,500 381.6,500 381.4,478 378.6,478"/>
        <polygon points="378.9,452 381.1,452 381,437 379,437"/>
        <polygon points="379.3,418 380.7,418 380.6,408 379.4,408"/>
        <polygon points="379.5,392 380.5,392 380.5,384 379.5,384"/>
      </g>
      <!-- zebra stripes (perspective band y 395-415) -->
      <g fill="#ffffff">
        <polygon points="283,415 296,415 299,395 287,395"/><polygon points="308,415 321,415 323,395 311,395"/>
        <polygon points="333,415 346,415 347,395 335,395"/><polygon points="358,415 371,415 371,395 359,395"/>
        <polygon points="384,415 397,415 396,395 384,395"/><polygon points="409,415 422,415 420,395 408,395"/>
        <polygon points="434,415 447,415 444,395 432,395"/><polygon points="459,415 471,415 468,395 456,395"/>
      </g>
      <!-- belisha beacons -->
      <rect x="262" y="350" width="4" height="62" fill="#222"/><circle cx="264" cy="347" r="8" fill="#f6b21b"/>
      <rect x="494" y="350" width="4" height="62" fill="#222"/><circle cx="496" cy="347" r="8" fill="#f6b21b"/>
      <!-- pedestrian waiting -->
      <circle cx="505" cy="380" r="6" fill="#e9b48f"/><rect x="500" y="386" width="10" height="20" rx="3" fill="#e46b4c"/>
      <!-- give way lines + painted triangle (left half = our side) -->
      <g stroke="#ffffff" stroke-width="2.5" stroke-dasharray="7 5">
        <line x1="341" y1="312" x2="379" y2="312"/><line x1="339" y1="318" x2="379" y2="318"/>
      </g>
      <polygon points="345,335 375,335 360,350" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <!-- signs on the LEFT verge: roundabout (blue) + give way -->
      <rect x="224" y="300" width="4" height="70" fill="#555"/>
      <circle cx="226" cy="292" r="20" fill="#1f5fb5" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M 214 288 A 12 12 0 0 1 232 282" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 238 292 A 12 12 0 0 1 228 304" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 220 304 A 12 12 0 0 1 214 293" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
      <polygon points="206,318 246,318 226,350" fill="#ffffff" stroke="#d22" stroke-width="4"/>
      <!-- AI car crossing from the right on the roundabout -->
      <g transform="translate(520,262)">
        <polygon points="-38,10 38,10 34,-6 18,-16 -16,-16 -30,-6" fill="#d64545"/>
        <polygon points="-14,-13 14,-13 26,-5 -24,-5" fill="#2a2f3a"/>
        <circle cx="-22" cy="12" r="6" fill="#1d1d1d"/><circle cx="22" cy="12" r="6" fill="#1d1d1d"/>
      </g>
      <line x1="470" y1="240" x2="420" y2="240" stroke="#1d2433" stroke-width="3" marker-end="url(#arrowDark)"/>
      <!-- player car, rear view, LEFT lane -->
      <g transform="translate(-28,0)">
        <polygon points="262,492 358,492 380,534 240,534" fill="#2556b8"/>
        <polygon points="270,498 350,498 368,530 252,530" fill="#2a2f3a"/>
        <rect x="222" y="532" width="176" height="70" rx="10" fill="#2f6fde"/>
        <rect x="230" y="548" width="34" height="14" rx="3" fill="#e23b3b"/>
        <rect x="356" y="548" width="34" height="14" rx="3" fill="#e23b3b"/>
        <rect x="230" y="548" width="12" height="14" rx="3" fill="#ffb300"/>
        <rect x="280" y="568" width="60" height="18" rx="2" fill="#f7d417" stroke="#222" stroke-width="1"/>
        <text x="310" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#111">KL26 LFT</text>
        <rect x="226" y="598" width="34" height="20" rx="4" fill="#1d1d1d"/>
        <rect x="360" y="598" width="34" height="20" rx="4" fill="#1d1d1d"/>
      </g>
      <!-- HUD: rear-view mirror -->
      <rect x="300" y="10" width="160" height="40" rx="10" fill="#2a2f3a" stroke="#ffffff" stroke-width="2"/>
      <rect x="308" y="16" width="144" height="28" rx="6" fill="#9db7cf"/>
      <polygon points="350,44 410,44 392,26 368,26" fill="#6b6f76"/>
      <!-- HUD: indicator buttons -->
      <rect x="14" y="14" width="62" height="44" rx="10" fill="#ffffff" opacity="0.9"/>
      <polygon points="30,36 48,24 48,48" fill="#26a65b"/>
      <rect x="684" y="14" width="62" height="44" rx="10" fill="#ffffff" opacity="0.9"/>
      <polygon points="730,36 712,24 712,48" fill="#9aa3ad"/>
      <!-- speed limit + speed -->
      <circle cx="40" cy="100" r="24" fill="#ffffff" stroke="#d22" stroke-width="6"/>
      <text x="40" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#111">30</text>
      <rect x="640" y="560" width="106" height="66" rx="12" fill="#ffffff" opacity="0.9"/>
      <text x="693" y="595" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2433">28</text>
      <text x="693" y="615" text-anchor="middle" font-size="13" fill="#5a6270">mph</text>
      <!-- steering wheel + pedals -->
      <circle cx="80" cy="565" r="56" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.85"/>
      <circle cx="80" cy="565" r="12" fill="#ffffff" opacity="0.85"/>
      <line x1="30" y1="565" x2="130" y2="565" stroke="#ffffff" stroke-width="8" opacity="0.85"/>
      <rect x="540" y="560" width="40" height="66" rx="8" fill="#ffffff" opacity="0.8"/>
      <rect x="590" y="545" width="40" height="81" rx="8" fill="#ffffff" opacity="0.8"/>
      <text x="560" y="598" text-anchor="middle" font-size="11" fill="#1d2433">brake</text>
      <text x="610" y="590" text-anchor="middle" font-size="11" fill="#1d2433">go</text>
      <!-- toast -->
      <rect x="150" y="62" width="460" height="54" rx="12" fill="#1d2433" opacity="0.92"/>
      <circle cx="180" cy="89" r="13" fill="#f2a33a"/><text x="180" y="95" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2433">!</text>
      <text x="204" y="85" font-size="17" font-weight="700" fill="#ffffff">Give way to traffic from your right</text>
      <text x="204" y="105" font-size="13" fill="#c9d1de">Highway Code rule 185 · tap to replay</text>
    </g>
    <rect x="0" y="0" width="760" height="640" rx="18" fill="none" stroke="#c9ced6" stroke-width="2"/>
    <text x="0" y="680" font-size="24" font-weight="700" fill="#1d2433">3D low-poly, chase camera (our plan)</text>
    <text x="0" y="708" font-size="16" fill="#5a6270">What you'd see on the road · Unity 6 · replays can still switch to the top-down view</text>
    <g font-size="16" fill="#1d2433">
      <text x="0" y="746">✔ Feels like real driving: signs, mirrors, judging the gap</text>
      <text x="0" y="772">✔ Skills transfer to the real road; strong "wow" in store videos</text>
      <text x="0" y="798">✘ More work: 3D roads, camera and performance tuning</text>
      <text x="0" y="824">✘ Bigger app; harder to see the whole junction at once (fixed by replay view)</text>
    </g>
  </g>

  <text x="800" y="975" text-anchor="middle" font-size="14" fill="#8a919c">Illustrative mock-up, not final art. UK details: driving on the left, clockwise roundabout, yellow rear number plate, Belisha beacons at the zebra.</text>
</svg>
