name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install pipeline and dev dependencies
        run: uv sync --frozen --all-extras
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Run pytest
        run: uv run pytest
      - name: Validate all content files
        run: uv run python -c "from ltl_pipeline.schema import validate_all_content; files = validate_all_content(); print('Validated:', [str(p) for p in files])"
      - name: Verify all code rule IDs exist in rules.yaml
        run: uv run python -c "from ltl_pipeline.rulepack import verify_code_rules_in_yaml; verify_code_rules_in_yaml()"
      - name: Verify rules.yaml is up to date with docs/02-rules-catalogue.md
        run: |
          uv run python -m ltl_pipeline.rulepack
          git diff --exit-code ../content/countries/gb/rules.yaml
